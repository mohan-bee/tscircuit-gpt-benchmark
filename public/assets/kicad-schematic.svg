<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">KiCad RC filter schematic</title>
  <desc id="desc">A one kilo-ohm resistor connects VIN to VOUT, with a 100 nanofarad capacitor from VOUT to ground.</desc>
  <rect width="800" height="500" fill="#f7f4ed"/>
  <g stroke="#d9d4ca" stroke-width="1" opacity=".55">
    <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800M0 450H800"/>
    <path d="M50 0V500M100 0V500M150 0V500M200 0V500M250 0V500M300 0V500M350 0V500M400 0V500M450 0V500M500 0V500M550 0V500M600 0V500M650 0V500M700 0V500M750 0V500"/>
  </g>
  <g fill="none" stroke="#16745d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 240H255M425 240H585V325"/>
    <circle cx="585" cy="240" r="6" fill="#16745d" stroke="none"/>
    <path d="M585 375V410M555 410H615M564 423H606M574 436H596"/>
  </g>
  <g fill="none" stroke="#b92b38" stroke-width="4" stroke-linecap="square">
    <path d="M255 240h18l12-30 20 60 20-60 20 60 20-60 20 60 22-30h18"/>
    <path d="M545 325H625M545 375H625"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="280" y="178" fill="#a51e2d" font-size="24" font-weight="700">R1</text>
    <text x="280" y="205" fill="#303432" font-size="19">1 kΩ</text>
    <text x="648" y="337" fill="#a51e2d" font-size="24" font-weight="700">C1</text>
    <text x="648" y="365" fill="#303432" font-size="19">100 nF</text>
    <text x="78" y="226" fill="#12604e" font-size="19" font-weight="700">VIN</text>
    <text x="600" y="225" fill="#12604e" font-size="19" font-weight="700">VOUT</text>
    <text x="605" y="446" fill="#12604e" font-size="17">GND</text>
    <text x="30" y="40" fill="#77766f" font-size="14">KiCad schematic · RC filter</text>
  </g>
</svg>

