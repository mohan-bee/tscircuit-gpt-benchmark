name: benchmark validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run validate:benchmarks
      - run: npm run validate:evaluations
        env:
          BENCHMARK_BASE_REF: origin/main
      - run: npm test
      - run: npm run build
